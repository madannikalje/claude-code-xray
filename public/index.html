<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code X-Ray</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a1916'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e0b341' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <button id="sidebar-toggle" class="small ghost" title="Toggle session list">☰</button>
  <div class="brand"><span class="word">xray</span><span class="eyebrow">Claude Code · session console / read-only</span></div>
  <div id="session-head" class="row grow"></div>
  <div class="theme-seg" id="theme" role="group" aria-label="Theme">
    <button data-theme="light" title="Light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button data-theme="system" title="System"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button data-theme="dark" title="Dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</header>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <nav class="tabs" id="tabs"></nav>
    <section class="view" id="view"><div class="empty">Loading sessions…</div></section>
  </main>
  <aside class="inspector" id="inspector" hidden></aside>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
